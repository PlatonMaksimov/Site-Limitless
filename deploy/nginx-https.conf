# Enable only after the certificate exists and nginx -t passes.
# This template is for the current IP; replace server_name/certificate paths
# when moving to a domain. Do not overwrite unrelated sites.
server {
    listen 80;
    listen [::]:80;
    server_name 45.152.198.96;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://45.152.198.96$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 45.152.198.96;
    ssl_certificate /etc/letsencrypt/live/limitless-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limitless-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/limitless/current/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /runtime-config.js {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
